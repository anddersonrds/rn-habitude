name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # One job: the install and cache restore cost more than the checks, so paying
  # for them once beats three parallel jobs.
  verify:
    name: Lint, typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      # Required: the suite's SQLite adapter is a Node builtin that Bun does not
      # carry. Without this, every src/lib test fails here and passes locally.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Restore the dependency cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test:ci
